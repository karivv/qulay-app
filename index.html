<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qulay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
/* ==================================================================
   QULAY — направление «Росток». Светлая и тёмная тема.
   ================================================================== */
.q{
  --g:#22B573; --on-g:#FFFFFF;
  --bg:#F1F7F2; --card:#FFFFFF; --card2:#E4EDE7;
  --ink:#16261F; --soft:#5F7368; --mut:#93A99E;
  --line:#E3EDE7; --gbg:#E4F5EC; --emph:#0E3B29;
  --sun:#FFC24B; --sunbg:#FFF4DE; --sun-ink:#A9761A;
  --red:#E05A44; --redbg:#FDECE8; --red-ink:#B23A26;
  --inv-bg:#0E3B29; --inv-ink:#FFFFFF;
  --grad:linear-gradient(145deg,#2ACB80,#12925A);
  --sh:0 6px 18px -12px rgba(14,59,41,.3);
  --shl:0 16px 32px -16px rgba(18,146,90,.85);
}
.q.dark{
  --g:#3ED88C; --on-g:#06140D;
  --bg:#0F1815; --card:#18241F; --card2:#243129;
  --ink:#E8F1EC; --soft:#9FB4A8; --mut:#778D82;
  --line:#26332C; --gbg:#16332A; --emph:#7FE3B4;
  --sun:#FFCE68; --sunbg:#33280F; --sun-ink:#FFCE68;
  --red:#F0755E; --redbg:#38201B; --red-ink:#F0755E;
  --inv-bg:#E8F1EC; --inv-ink:#0F1815;
  --grad:linear-gradient(145deg,#1E9A63,#0B6540);
  --sh:0 6px 18px -10px rgba(0,0,0,.7);
  --shl:0 16px 32px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"Rubik",ui-sans-serif,system-ui,
  -apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:2.5px solid var(--g);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* высоту задаём из JS по окну Telegram: 100vh внутри Mini App врёт,
   из-за чего нижняя панель уезжала под край экрана */
#app{max-width:480px;margin:0 auto;height:100%;
  display:flex;flex-direction:column;position:relative;overflow:hidden}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.pad{padding:14px 18px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.push{margin-top:auto}

.q-top{display:flex;justify-content:space-between;align-items:center;flex:none}
.q-logo{font-family:"Comfortaa",ui-rounded,system-ui,sans-serif;font-weight:700;font-size:17px;
  color:var(--emph);display:flex;align-items:center;gap:6px}
.q-logo i{width:8px;height:8px;background:var(--g);border-radius:0 60% 0 60%;
  transform:rotate(-20deg);display:block}
.q-logo em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--mut);
  letter-spacing:.1em;text-transform:uppercase;margin-left:2px}
.q-ava{width:36px;height:36px;border-radius:13px;background:var(--gbg);color:var(--emph);
  display:grid;place-items:center;font-size:14px;font-weight:700;border:none}
.q-hi{margin:0;font-size:25px;font-weight:700;letter-spacing:-.035em;line-height:1.14;flex:none}
.q-hi span{display:block;font-size:13.5px;font-weight:400;color:var(--soft);margin-top:6px;
  letter-spacing:0}
.q-h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.03em;flex:none}

.q-hero{position:relative;overflow:hidden;border:none;text-align:left;width:100%;flex:none;
  background:var(--grad);color:#fff;border-radius:28px 28px 28px 10px;padding:21px;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shl);transition:transform .15s}
.q-hero:active{transform:scale(.985)}
.q-hero .leaf{position:absolute;right:-26px;top:-30px;width:150px;height:150px;opacity:.13;
  pointer-events:none}
.q-hero .k{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.88}
.q-hero .t{font-size:24px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.q-hero .s{font-size:13.5px;opacity:.92}
.q-hero .go{position:absolute;right:18px;bottom:18px;width:38px;height:38px;border-radius:14px;
  background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:17px}

.q-card{background:var(--card);border-radius:22px;padding:16px;flex:none;box-shadow:var(--sh)}
.q-card.flat{box-shadow:none;border:1.5px solid var(--line)}
.q-row{display:flex;gap:12px;align-items:center}
.q-ic{width:42px;height:42px;border-radius:14px;background:var(--gbg);color:var(--emph);
  display:grid;place-items:center;font-size:17px;flex:none;font-weight:700}
.q-ic.sun{background:var(--sunbg);color:var(--sun-ink)}
.q-ic.red{background:var(--redbg);color:var(--red-ink)}
.q-ic.sm{width:36px;height:36px;border-radius:12px;font-size:14px}
.q-row .a{font-size:15px;font-weight:600;letter-spacing:-.01em}
.q-row .b{font-size:12.5px;color:var(--soft);margin-top:2px}

.q-stats{display:flex;gap:8px;flex:none}
.q-st{flex:1;background:var(--card);border-radius:18px;padding:13px 11px;box-shadow:var(--sh)}
.q-st .n{font-size:22px;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums;
  line-height:1;color:var(--emph)}
.q-st .n small{font-size:12px;font-weight:600;color:var(--soft);margin-left:2px}
.q-st .c{font-size:10.5px;color:var(--mut);margin-top:5px;line-height:1.35;font-weight:500}
.q-lbl{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--mut);flex:none}

.q-btn{border:none;border-radius:17px;padding:16px;font-size:15.5px;font-weight:700;width:100%;
  flex:none;background:var(--g);color:var(--on-g);letter-spacing:-.01em;transition:.15s;
  box-shadow:0 10px 22px -12px rgba(34,181,115,.9)}
.q-btn:active{transform:scale(.99)}
.q-btn.ghost{background:var(--card);color:var(--soft);box-shadow:none;border:1.5px solid var(--line)}
.q-btn.danger{background:var(--card);color:var(--red);box-shadow:none;border:1.5px solid var(--line)}
.q-btn.sm{padding:12px;font-size:14px;border-radius:14px;box-shadow:none}
/* две кнопки в ряд: без этого каждая тянет свои 100% и вылезает за карточку */
.q-pair{display:flex;gap:8px;margin-top:12px}
.q-pair .q-btn{width:auto;flex:1;min-width:0;margin-top:0}
.q-btn[disabled]{background:var(--card2);color:var(--mut);box-shadow:none}
.q-back{border:none;background:none;color:var(--soft);font-size:14px;font-weight:600;
  padding:2px 0;text-align:left;flex:none}

.q-f{display:flex;flex-direction:column;gap:7px;flex:none}
.q-f label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.q-f input,.q-f textarea{width:100%;border:1.5px solid var(--line);border-radius:15px;padding:14px;
  font-size:16px;background:var(--card);color:var(--ink);font-weight:500;transition:.15s}
.q-f textarea{min-height:58px;resize:none}
.q-f input:focus,.q-f textarea:focus{outline:none;border-color:var(--g);
  box-shadow:0 0 0 3.5px rgba(34,181,115,.18)}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-help{font-size:12.5px;color:var(--soft);line-height:1.45;flex:none}

.q-seg{display:flex;gap:4px;background:var(--card2);border-radius:16px;padding:4px;flex:none}
.q-seg button{flex:1;border:none;background:none;border-radius:12px;padding:11px;font-size:13.5px;
  font-weight:600;color:var(--soft);transition:.15s}
.q-seg button[aria-pressed="true"]{background:var(--card);color:var(--emph);font-weight:700;
  box-shadow:0 2px 6px -2px rgba(14,59,41,.2)}
.q-chips{display:flex;flex-wrap:wrap;gap:7px;flex:none}
.q-chip{border:1.5px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;
  padding:10px 15px;font-size:13px;font-weight:600;transition:.15s}
.q-chip[aria-pressed="true"]{border-color:var(--g);background:var(--gbg);color:var(--emph)}

.q-air{background:var(--card);border-radius:22px;padding:16px;display:flex;align-items:center;
  gap:12px;flex:none;box-shadow:var(--sh);border:2px solid transparent;transition:.2s}
.q-air.on{border-color:var(--g);background:var(--gbg)}
.q-air .t{font-size:15px;font-weight:700}
.q-air .b{font-size:12.5px;color:var(--soft);margin-top:2px}
.q-sw{width:50px;height:30px;border-radius:16px;background:var(--card2);position:relative;flex:none;
  border:none;transition:.2s}
.q-sw.on{background:var(--g)}
.q-sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:var(--card);transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.q-sw.on i{left:23px;background:#fff}

.q-lvl{background:var(--card);border-radius:22px;padding:16px;display:flex;align-items:center;
  gap:14px;flex:none;box-shadow:var(--sh)}
.q-ring{width:58px;height:58px;flex:none;position:relative}
.q-ring svg{transform:rotate(-90deg)}
.q-ring .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.q-lvl .t{font-size:15px;font-weight:700;letter-spacing:-.01em}
.q-lvl .b{font-size:12.5px;color:var(--soft);margin-top:3px}
.q-lvl .p{font-size:12px;color:var(--mut);margin-top:4px;font-variant-numeric:tabular-nums}

.q-live{background:var(--grad);border-radius:26px;padding:20px;color:#fff;flex:none;
  box-shadow:var(--shl);position:relative;overflow:hidden}
.q-live .leaf{position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;opacity:.12}
.q-live .k{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.88}
.q-live .eta{font-size:42px;font-weight:700;letter-spacing:-.05em;line-height:1;margin-top:5px;
  font-variant-numeric:tabular-nums}
.q-live .eta small{font-size:15px;font-weight:600;opacity:.85;margin-left:5px}
.q-live .t{font-size:21px;font-weight:700;letter-spacing:-.035em;margin-top:4px;line-height:1.15}
.q-live .s{font-size:13.5px;opacity:.92;margin-top:5px}
.q-who{display:flex;gap:12px;align-items:center;margin-top:16px;padding-top:15px;
  border-top:1px solid rgba(255,255,255,.26);position:relative}
.q-who .ph{width:42px;height:42px;border-radius:15px;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.q-who .nm{font-size:15px;font-weight:700}
.q-who .rt{font-size:12.5px;opacity:.88;margin-top:1px}
.q-call{width:42px;height:42px;border-radius:15px;background:#fff;color:#12925A;border:none;
  display:grid;place-items:center;font-size:17px;flex:none;text-decoration:none}

.q-map{border-radius:22px;overflow:hidden;flex:none;box-shadow:var(--sh)}
.q-map svg{display:block;width:100%;height:auto}
.q-vdot{transition:cx .9s linear,cy .9s linear}

.q-steps{display:flex;flex-direction:column;flex:none}
.q-step{display:flex;gap:14px;padding:10px 0}
.q-step .col{display:flex;flex-direction:column;align-items:center;flex:none}
.q-step .dot{width:26px;height:26px;border-radius:50%;background:var(--card2);color:var(--mut);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;transition:.25s}
.q-step.on .dot{background:var(--g);color:var(--on-g);box-shadow:0 0 0 5px rgba(34,181,115,.18)}
.q-step.ok .dot{background:var(--inv-bg);color:var(--inv-ink)}
.q-step .ln{width:2.5px;flex:1;background:var(--card2);margin:4px 0;min-height:12px;border-radius:2px}
.q-step.ok .ln{background:var(--emph)}
.q-step .t{font-size:14.5px;font-weight:600;color:var(--mut);transition:.25s}
.q-step.on .t,.q-step.ok .t{color:var(--ink)}
.q-step.on .t{font-weight:700}
.q-step .b{font-size:12.5px;color:var(--soft);margin-top:2px}

.q-photo{border:2px dashed var(--line);border-radius:22px;padding:22px 16px;text-align:center;
  background:var(--card);flex:none;width:100%;color:var(--ink);transition:.2s;display:block}
.q-photo.done{border-style:solid;border-color:var(--g);background:var(--gbg)}
.q-photo .e{font-size:28px}
.q-photo .t{font-size:15px;font-weight:700;margin-top:8px}
.q-photo .b{font-size:12.5px;color:var(--soft);margin-top:4px}
.q-photo img{max-width:100%;border-radius:14px;margin-top:10px}
.q-photo input{display:none}

.q-fin{text-align:center;padding:22px 0 4px;flex:none}
.q-fin .e{font-size:56px;line-height:1;animation:pop .55s cubic-bezier(.2,1.35,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.q-fin h4{margin:14px 0 0;font-size:24px;font-weight:700;letter-spacing:-.035em}
.q-fin p{margin:9px auto 0;font-size:14px;color:var(--soft);max-width:29ch;line-height:1.5}
.stars{display:flex;justify-content:center;gap:6px;flex:none}
.stars button{border:none;background:none;font-size:32px;padding:2px;line-height:1;
  filter:grayscale(1);opacity:.28;transition:.16s}
.stars button.on{filter:none;opacity:1;transform:scale(1.1)}

.q-empty{background:var(--card);border-radius:22px;padding:28px 18px;text-align:center;flex:none;
  box-shadow:var(--sh)}
.q-empty .e{font-size:34px;opacity:.55}
.q-empty .t{font-size:15.5px;font-weight:700;margin-top:10px}
.q-empty .b{font-size:13px;color:var(--soft);margin-top:6px;line-height:1.5}

.q-alert{position:fixed;left:10px;right:10px;top:10px;z-index:90;border-radius:22px;padding:15px;
  background:linear-gradient(145deg,#FFCE68,#F5A623);color:#3D2A05;display:flex;gap:12px;
  align-items:center;box-shadow:0 16px 34px -14px rgba(180,120,10,.7);max-width:460px;
  margin:0 auto;transform:translateY(-170%);transition:transform .4s cubic-bezier(.2,1.1,.3,1)}
.q-alert.show{transform:translateY(0)}
.q-alert .bell{width:44px;height:44px;border-radius:15px;background:rgba(61,42,5,.14);
  display:grid;place-items:center;font-size:20px;flex:none;animation:ring 1s infinite}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-13deg)}40%{transform:rotate(13deg)}
  60%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}}
.q-alert .k{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;opacity:.75}
.q-alert .t{font-size:16px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.q-alert .b{font-size:12px;opacity:.8;margin-top:1px}
.q-alert .go{border:none;background:#3D2A05;color:#FFCE68;border-radius:13px;padding:11px 15px;
  font-size:13.5px;font-weight:700;flex:none}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);
  background:var(--inv-bg);color:var(--inv-ink);padding:12px 18px;border-radius:14px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:95;
  max-width:86%;text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.conn{position:fixed;top:0;left:0;right:0;z-index:99;padding:8px 14px;font-size:12px;
  font-weight:700;text-align:center;color:#fff;background:var(--red);
  transform:translateY(-100%);transition:.3s}
.conn.show{transform:translateY(0)}

.q-nav{flex:none;display:flex;background:var(--card);padding:9px 8px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px -14px rgba(14,59,41,.35)}
.q-nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;
  align-items:center;gap:4px;padding:5px 2px;color:var(--mut);transition:.15s}
.q-nav button[aria-pressed="true"]{color:var(--g)}
.q-nav .ib{width:34px;height:26px;border-radius:10px;display:grid;place-items:center;
  transition:.15s;position:relative}
.q-nav button[aria-pressed="true"] .ib{background:var(--gbg)}
.q-nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.q-nav .lb{font-size:10.5px;font-weight:600;letter-spacing:-.01em}
.q-nav .badge{position:absolute;top:-3px;right:-1px;min-width:16px;height:16px;border-radius:9px;
  background:var(--sun);color:#3D2A05;font-size:10px;font-weight:800;display:grid;
  place-items:center;padding:0 4px}

.q-list{background:var(--card);border-radius:22px;overflow:hidden;flex:none;box-shadow:var(--sh)}
.q-li{display:flex;align-items:center;gap:12px;padding:15px 16px;width:100%;background:none;
  border:none;text-align:left;color:inherit;border-bottom:1px solid var(--line)}
.q-li:last-child{border-bottom:none}
.q-li .t{font-size:15px;font-weight:600;flex:1}
.q-li .v{font-size:13px;color:var(--mut);font-weight:500}
.q-li .ch{color:var(--mut);font-size:17px}
.q-li.danger .t{color:var(--red)}

.q-score{background:var(--card);border-radius:22px;padding:18px;flex:none;display:flex;gap:18px;
  align-items:center;box-shadow:var(--sh)}
.q-score .big{font-size:44px;font-weight:700;letter-spacing:-.05em;line-height:1;color:var(--emph);
  font-variant-numeric:tabular-nums}
.q-score .sub{font-size:12.5px;color:var(--soft);margin-top:4px}
.q-dist{flex:1;display:flex;flex-direction:column;gap:5px}
.q-drow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);font-weight:600}
.q-drow .tr{height:6px;flex:1;background:var(--card2);border-radius:3px;overflow:hidden}
.q-drow .tr i{display:block;height:100%;background:var(--sun);border-radius:3px}
.q-drow .cnt{width:18px;text-align:right;font-variant-numeric:tabular-nums}
.q-rev{background:var(--card);border-radius:20px;padding:15px;flex:none;box-shadow:var(--sh)}
.q-rev .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.q-rev .st{font-size:13px;letter-spacing:1px;color:var(--sun)}
.q-rev .dt{font-size:11.5px;color:var(--mut)}
.q-rev .tx{font-size:14px;margin-top:9px;line-height:1.5}
.q-rev .fr{font-size:12px;color:var(--soft);margin-top:9px}

.q-rank{background:var(--card);border-radius:22px;overflow:hidden;flex:none;box-shadow:var(--sh)}
.q-rk{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.q-rk:last-child{border-bottom:none}
.q-rk.me{background:var(--gbg)}
.q-rk .pos{width:26px;font-size:14px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.q-rk.me .pos{color:var(--g)}
.q-rk .nm{flex:1;font-size:14.5px;font-weight:600}
.q-rk.me .nm{font-weight:700}
.q-rk .vl{font-size:13.5px;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums}
.q-medal{font-size:15px;width:26px}

.q-badges{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;flex:none}
.q-bg{background:var(--card);border-radius:16px;padding:11px 6px;text-align:center;box-shadow:var(--sh)}
.q-bg.off{opacity:.4;box-shadow:none;background:var(--card2)}
.q-bg .e{font-size:22px;line-height:1.1}
.q-bg .n{font-size:9.5px;font-weight:600;color:var(--soft);margin-top:6px;line-height:1.25}

.q.big .q-row .b,.q.big .q-li .v,.q.big .q-step .b,.q.big .q-help,.q.big .q-st .c,
.q.big .q-hero .s,.q.big .q-live .s,.q.big .q-empty .b,.q.big .q-lvl .b,
.q.big .q-air .b,.q.big .q-rev .fr,.q.big .q-fin p{font-size:14px}
.q.big .q-row .a,.q.big .q-li .t,.q.big .q-step .t,.q.big .q-rk .nm,
.q.big .q-air .t,.q.big .q-lvl .t,.q.big .q-empty .t{font-size:16.5px}

function distM(a,b){
  if(!a||!b||a.lat==null||b.lat==null) return null;
  const R=6371000, t=x=>x*Math.PI/180;
  const dLat=t(b.lat-a.lat), dLng=t(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(s)));
}

const openOrders=()=>Object.entries(S.orders)

/* Заявка, которую этот человек закрыл, но ещё не оценил. Раньше окно для

   было уже нельзя, то есть рейтинг почти не собирался бы. */
function pendingRating(){
  const list = ROLE==='cl' ? myOrders() : myJobs();
  const field = ROLE==='cl' ? 'ratingOfVolunteer' : 'ratingOfResident';
  return list.find(o=>o.status==='done' && !o[field]
    && Date.now()-(o.doneAt||o.createdAt||0) < 7*86400000) || null;
}
function rankIn(role,key,val){
  if(!val) return null;
  const rows=Object.entries(S.board).filter(([,r])=>r&&r.role===role&&r[key]===val)
    .sort((a,b)=>role==='volunteer'
      ? ((b[1].points||0)-(a[1].points||0))
      : ((b[1].ordersCompleted||0)-(a[1].ordersCompleted||0)));
  const i=rows.findIndex(([id])=>id===uid);
  return i===-1?null:{pos:i+1,rows};
}
function myReviews(){
  return myJobs().filter(o=>o.ratingOfVolunteer)
    .map(o=>({...o.ratingOfVolunteer, a:A(o), from:o.clientName||'Житель', at:o.doneAt||o.createdAt}))
    .sort((a,b)=>(b.at||0)-(a.at||0));
}
function distOf(list){
  const d={5:0,4:0,3:0,2:0,1:0};
  list.forEach(r=>{ if(d[r.stars]!=null) d[r.stars]++ });

}

function onPhone(inp){

/* строки с подставленными именами и числами — по образцу */
const UZ_RE=[
  [/^Салом, (.+)$/,"Salom, $1"],
  [/^Готово, (.+)! Роль: житель$/,"Tayyor, $1! Rol: yashovchi"],
  [/^Готово, (.+)! Роль: волонтёр$/,"Tayyor, $1! Rol: ko‘ngilli"],
  [/^Оцените (.+)$/,"$1 ni baholang"],
  [/^Как справился (.+)$/,"$1 qanday bajardi"],
  [/^(.+) донёс пакет до контейнера\. Вам не пришлось выходить\.$/,
   "$1 paketni konteynergacha olib bordi. Sizga chiqishga to‘g‘ri kelmadi."],
  [/^До следующего уровня (\d+) очков$/,"Keyingi darajagacha $1 ochko"],
  [/^Ищем в радиусе (.+)$/,"$1 radiusda qidiryapmiz"],
  [/^Радиус: (.+)$/,"Radius: $1"],
  [/^Не больше (\d+) заявок в сутки$/,"Kuniga $1 tadan ko‘p emas"],
  [/^(\d+) оценок$/,"$1 ta baho"],
  [/^(\d+) заявк\S* ждут? рядом$/,"Yaqinda $1 ta buyurtma kutyapti"],
  [/^Всего (\d+) заявк\S* · (\d+) кг не осталось у подъезда$/,
   "Jami $1 ta buyurtma · $2 kg podez oldida qolmadi"],
  [/^(\d+) заявк\S* (?:закрыт\S*) · (\d+) очков всего$/,"$1 ta buyurtma yopildi · jami $2 ochko"],
  [/^\+20 очков за эту заявку$/,"Bu buyurtma uchun +20 ochko"],
  [/^(.+) м от вас$/,"Sizdan $1 m"],
  [/^(.+) км от вас$/,"Sizdan $1 km"],
  [/^Соседи по дому (.+)$/,"$1-uy qo‘shnilari"],
  [/^Записать на (.+)$/,"$1 ga yozish"],
  [/^только что$/,"hozirgina"],
  [/^(\d+) мин назад$/,"$1 daq oldin"],
  [/^(\d+) ч назад$/,"$1 soat oldin"],
];
function uzText(s){
  const k=s.trim(); if(!k) return null;
  if(UZ[k]) return s.replace(k,UZ[k]);
  for(const [re,to] of UZ_RE){ if(re.test(k)) return s.replace(k,k.replace(re,to)) }
  return null;
}
/* Проходим по текстовым узлам готового экрана. Код и обработчики не трогаем. */
function localize(root){
  if(S.set.lang!=='uz'||!root) return;
  try{
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n=>{ const v=uzText(n.nodeValue); if(v!=null) n.nodeValue=v });
    root.querySelectorAll('[placeholder]').forEach(el=>{
      const v=UZ[el.getAttribute('placeholder')]; if(v) el.setAttribute('placeholder',v);
    });
  }catch(e){}
}

function render(){
  applyChrome();
  if(!S.ready){ $('#app').innerHTML=`<div class="scroll"><div class="pad">
    <div class="q-empty" style="margin:auto"><div class="e">🌿</div>
    <div class="t">Загружаем…</div><div class="b">Секунду, читаем ваш профиль</div></div></div></div>`; return }
  if(!me||!me.phone){ $("#app").innerHTML=regView(); localize($("#app")); return }
  if(me.blocked){ $("#app").innerHTML=blockedView(); localize($("#app")); return }
  const V = ROLE==='cl'
    ? {home:cHome,new:cNew,live:cLive,hist:cHist,rank:cRank,fin:cFin,prof:profileView,
       set:settingsView,help:helpView}
    : {home:vHome,work:vWork,hist:vHist,rev:vRev,fin:vFin,prof:profileView,
       set:settingsView,help:helpView};
  $('#app').innerHTML=(V[S.view]||V.home)();
  localize($('#app'));
}
/* Пока волонтёр в пути, двигаем точку и минуты точечно — без пересборки
   всего экрана: полная перерисовка сбрасывает прокрутку и тормозит. */
function tickLive(){
  const o = ROLE==='cl' ? S.myOrder : S.activeJob;
  if(!o||!o.takenAt) return;
  if(S.view!=='live'&&S.view!=='work') return;
  const ph=phaseOf(o); if(ph<1||ph>2) return;
  const p=ROUTE[Math.min(travelPos(o),ROUTE.length-1)];
  document.querySelectorAll('.q-vdot').forEach(el=>{
    el.setAttribute('cx',p[0]); el.setAttribute('cy',p[1]);
  });
  const e=document.querySelector('[data-eta]');
  if(e) e.textContent=etaMin(o);
}
setInterval(tickLive,4000);

function toast(m){const t=$("#toast");t.textContent=(S.set.lang==="uz"&&uzText(m))||m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2600)}
function conn(msg){const c=$('#conn');
  if(!msg){c.classList.remove('show');return}
  c.textContent=msg;c.classList.add('show')}

/* ================= подключение ================= */
function boot(){
  fitViewport(); applyChrome(); render();
  try{
    firebase.initializeApp(CFG);
    db=firebase.database();
  }catch(e){ conn('Не удалось подключиться'); S.ready=true; render(); return }

  let everConnected=false;
  db.ref('.info/connected').on('value',s=>{
    if(s.val()===true){ everConnected=true; conn(''); }
    else if(everConnected){ conn('Нет связи с сервером'); }
  });

  loadProfile(0);
}
function loadProfile(attempt){
  db.ref('users/'+uid).once('value').then(s=>{
    const v=s.val();
    if(v&&v.phone){
      // роль из базы — источник правды, но только если она там вообще есть:
      // пустое поле не должно молча понизить волонтёра до жителя
      if(v.role) lockRole(v.role);
      me={name:v.name||'',phone:v.phone,role:ROLE,house:v.house||'',district:v.district||'',
          gender:v.gender||'',blocked:!!v.blocked,
          createdAt:v.createdAt||Date.now(),addr:me&&me.addr?me.addr:S.addr};
      localStorage.setItem('qulay_profile',JSON.stringify(me));
      if(me.house&&!S.addr.h) S.addr.h=me.house;
    }
    start();
  }).catch(()=>{
    // сеть подвела — пробуем ещё дважды, роль при этом берём из кэша, а не из ссылки
    if(attempt<2){ setTimeout(()=>loadProfile(attempt+1), 900*(attempt+1)); return }
    conn('Нет связи — показываем сохранённые данные');
    start();
  });
}
function start(){
  S.ready=true;
  if(ROLE==='vo'){
    db.ref('users/'+uid+'/onair').once('value').then(s=>{
      if(s.exists()) S.onair=!!s.val();
      else db.ref('users/'+uid+'/onair').set(true).catch(()=>{});
      render();
    }).catch(()=>{});
    // последняя известная позиция — чтобы расстояния были сразу, без повторного запроса
    db.ref('users/'+uid+'/geo').once('value').then(s=>{
      const g=s.val();
      if(g&&g.lat!=null&&Date.now()-(g.at||0)<6*3600000){
        S.geo={lat:g.lat,lng:g.lng}; S.geoState='ok'; render();
      }
    }).catch(()=>{});
  }
  db.ref('leaderboard').on('value',s=>{ S.board=s.val()||{}; render() },()=>{});
  loadRefs();
  listen();
  render();
}
function listen(){
  db.ref('orders').limitToLast(100).on('value',snap=>{
    S.orders=snap.val()||{};
    if(ROLE==='cl'){
      const mine=myOrders();
      const live=mine.find(o=>o.status!=='done'&&o.status!=='cancelled');
      S.myOrder=live||null;
      if(S.myOrder && S.view==='new') S.view='live';
      if(!S.myOrder && S.view==='live'){
        const pr=pendingRating();
        if(pr){ S.finOrder=pr; S.view='fin' } else S.view='home';
      }
      if(S.myOrder&&S.myOrder.status==='open') armWait(S.myOrder);
      else { clearTimeout(waitT); S.noVol=false; S.waitUntil=0 }
    }else{
      const act=myJobs().find(o=>o.status!=='done'&&o.status!=='cancelled');
      const prev=S.activeJob;
      S.activeJob=act||null;
      if(prev&&!act&&prev.status!=='done'){
        const closed=myJobs().find(o=>o.id===prev.id&&o.status==='done');
        if(closed&&S.view==='work'){ S.finOrder=closed; S.view='fin' }
      }
      if(S.activeJob&&S.view==='home'&&phaseOf(S.activeJob)>=1&&!S.seen.has('w'+S.activeJob.id)){
        S.seen.add('w'+S.activeJob.id);
      }
      checkNew();
    }
    render();
  },()=>{ conn('Нет доступа к базе — проверьте правила Firebase'); S.ready=true; render() });
}
/* Момент, после которого показываем «никто не откликнулся», держим отдельно:
   раньше он пересчитывался от времени создания заявки при каждом обновлении
   базы, поэтому «Подождать ещё» тут же отменялось следующим же снимком. */
function armWait(o){
  clearTimeout(waitT);
  if(!S.waitUntil) S.waitUntil=(o.createdAt||Date.now())+120000;
  const left=S.waitUntil-Date.now();
  if(left<=0){ S.noVol=true; return }
  S.noVol=false;
  waitT=setTimeout(()=>{ if(S.myOrder&&S.myOrder.status==='open'){ S.noVol=true; render() } },left);
}
function keepWaiting(){
  S.waitUntil=Date.now()+120000; S.noVol=false;
  if(S.myOrder) armWait(S.myOrder);
  render(); toast('Ищем дальше');
}

/* уведомление волонтёру о новой заявке */
function checkNew(){
  const list=openOrders();
  // первый снимок из базы — это всё, что уже висело до открытия приложения.
  // Помечаем как виденное и молчим, иначе волонтёр при каждом входе получает
  // звонок о заявке недельной давности.
  if(!S.primed){ list.forEach(o=>S.seen.add(o.id)); S.primed=true; return }
  if(!me||!me.phone||!S.onair||S.activeJob){ list.forEach(o=>S.seen.add(o.id)); return }
  const fresh=list.filter(o=>!S.seen.has(o.id));
  list.forEach(o=>S.seen.add(o.id));
  if(fresh.length) fireAlert(fresh[0]);
}
function fireAlert(o){
  S.alertOrder=o;
  const a=$('#alert');
  a.innerHTML=`<div class="bell">🔔</div>
    <div style="flex:1"><div class="k">Новая заявка рядом</div>
      <div class="t">${esc(A(o))}</div><div class="b">${esc(M(o))} · ${esc(o.bags||'')}</div></div>
    <button class="go" onclick="takeAlert()">Взять</button>`;
  a.classList.add('show');
  if(S.set.sound) beep();
  if(S.set.vibro) buzz();
  clearTimeout(a._x); a._x=setTimeout(()=>a.classList.remove('show'),15000);
}
function takeAlert(){ const o=S.alertOrder; $('#alert').classList.remove('show');
  S.alertOrder=null; if(o) claim(o.id) }
let audioCtx=null;
function beep(){ try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  [0,210,420].forEach(d=>setTimeout(()=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=900;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.24);
  },d));}catch(e){} }

function askGeo(){

         // волонтёру координаты нужны, чтобы считать расстояние до заявок
         if(ROLE==='vo'&&db) db.ref('users/'+uid+'/geo').set({...S.geo,at:Date.now()}).catch(()=>{});
         render(); toast('Местоположение определено') },
    ()=>{ S.geoState='denied'; render(); toast('Без геопозиции расстояние показать не сможем') },
    {enableHighAccuracy:true,timeout:9000,maximumAge:120000}

function saveProfile(){
  const name=S.reg.name.trim(), phone=fmtPhone(S.reg.phone), place=S.reg.place.trim();
  if(name.length<2||phoneDigits(phone).length!==9){ toast('Проверьте имя и номер'); return }
  if(!place){ toast(ROLE==='vo'?'Укажите район':'Укажите дом'); return }
  if(ROLE==='vo'&&!S.reg.photo){ toast('Добавьте своё фото'); return }
  if(ROLE==='vo'&&!S.reg.gender){ toast('Укажите, женщина вы или мужчина'); return }
  if(ROLE==='vo'&&!S.reg.doc){ toast('Добавьте фото документа'); return }
  if(!db){ toast('Нет связи с сервером'); return }
  const btn=$('#r_btn'); if(btn) btn.disabled=true;
  if(ROLE!=='vo'){ writeProfile(name,phone,'client',place); return }
  const code=S.reg.code.trim().toUpperCase();
  db.ref('inviteCodes/'+code).transaction(cur=>{
    if(cur===null||cur.used) return;          // нет кода или уже потрачен
    cur.used=true; cur.usedBy=uid; cur.usedByName=name; cur.usedAt=Date.now();
    return cur;
  },(err,committed)=>{
    if(err||!committed){ if(btn) btn.disabled=false; toast('Код неверный или уже использован'); return }
    writeProfile(name,phone,'volunteer',place);
  });
}
function writeProfile(name,phone,fbRole,place){
  const house = fbRole==='volunteer' ? '' : place;
  const district = fbRole==='volunteer' ? place : '';
  lockRole(fbRole);
  me={name,phone,role:ROLE,house,district,createdAt:Date.now(),addr:S.addr};
  if(house&&!S.addr.h) S.addr.h=house;
  localStorage.setItem('qulay_profile',JSON.stringify(me));
  db.ref('users/'+uid).update({name,phone,role:fbRole,createdAt:me.createdAt,
    house:house||null,district:district||null,
    hasPhoto:fbRole==='volunteer'&&!!S.reg.photo,
    hasDoc:fbRole==='volunteer'&&!!S.reg.doc,
    gender:fbRole==='volunteer'?(S.reg.gender||null):null,
    invitedBy:(P.get('ref')||'')||null}).catch(()=>{});
  if(fbRole==='volunteer'&&S.reg.photo){
    // фото — в отдельном узле: список заявок читают все, тащить туда портреты нельзя
    S.photos[uid]=S.reg.photo;
    db.ref('volunteerPhotos/'+uid).set({img:S.reg.photo,at:Date.now()})
      .catch(()=>toast('Фото не сохранилось — проверьте правила Firebase'));
  }
  if(fbRole==='volunteer'&&S.reg.doc){
    // документ пишем в узел, который приложению читать нельзя — только боту
    db.ref('volunteerDocs/'+uid).set({img:S.reg.doc,at:Date.now(),name}).catch(()=>{});
  }
  const ref=P.get('ref');
  if(ref&&ref!==uid){
    // отмечаемся у пригласившего, чтобы он видел, кого позвал
    db.ref('referrals/'+ref+'/'+uid).set({name,phone,role:fbRole,at:Date.now()}).catch(()=>{});
  }
  db.ref('leaderboard/'+uid).transaction(cur=>{
    cur=cur||{points:0,ordersCompleted:0,ratingSum:0,ratingCount:0};
    cur.name=name; cur.role=fbRole; cur.house=house||null; cur.district=district||null;
    return cur;
  });
  S.view='home'; render();
  toast('Готово, '+name+'! Роль: '+(fbRole==='volunteer'?'волонтёр':'житель'));
}

function submit(){
  // вторая одновременная заявка делала первую невидимой для жителя,
  // но она продолжала висеть у волонтёров
  if(S.myOrder){ toast('У вас уже есть активная заявка'); S.view='live'; render(); return }
  // мягкий предохранитель на время пилота: волонтёров мало, и один человек
  // не должен занимать их весь день
  const since=Date.now()-86400000;
  const today=myOrders().filter(o=>(o.createdAt||0)>since&&o.status!=='cancelled').length;
  if(today>=DAY_LIMIT){ toast(`Не больше ${DAY_LIMIT} заявок в сутки`); return }
  const h=($('#i_h').value||'').trim(), q=($('#i_q').value||'').trim();
  if(!h||!q){ toast('Укажите дом и квартиру'); return }
  S.addr={h,e:($('#i_e').value||'').trim(),f:($('#i_f').value||'').trim(),q,
          note:($('#i_n').value||'').trim()};
  me.addr=S.addr; localStorage.setItem('qulay_profile',JSON.stringify(me));
  if(!db){ toast('Нет связи с сервером'); return }
  db.ref('orders').push({
    clientId:uid, clientName:me.name, clientPhone:me.phone,
    house:S.addr.h, entrance:S.addr.e, floor:S.addr.f, flat:S.addr.q,
    note:S.addr.note, bags:S.bags, when:S.mode==='now'?'сейчас':('сегодня в '+S.timeV),
    status:'open', createdAt:Date.now(),
    lat:S.geo?S.geo.lat:null, lng:S.geo?S.geo.lng:null,
    prefFemale:S.prefFemale||null
  }).then(()=>{ S.noVol=false; S.view='live'; render(); toast('Заявка отправлена волонтёрам') })
   .catch(()=>toast('Не удалось отправить заявку'));

function claim(id){
  if(S.activeJob){ toast('Сначала закройте текущую заявку'); return }
  db.ref('orders/'+id).transaction(o=>{
    if(!o) return o;
    if(o.status!=='open') return;             // кто-то успел раньше
    o.status='taken'; o.volunteerId=uid; o.volunteerName=me.name;
    o.volunteerPhone=me.phone; o.takenAt=Date.now();
    return o;
  }).then(r=>{
    if(!r.committed){ toast('Заявку уже взял другой волонтёр'); S.view='home'; render(); return }
    S.activeJob={id,...r.snapshot.val()}; S.photoURL=null; S.view='work'; render();
    toast('Заявка ваша — житель видит, что вы в пути');
  }).catch(()=>toast('Не удалось взять заявку'));

function setStatus(s){
  const o=S.activeJob; if(!o) return;
  const upd={status:s};
  if(s==='arrived') upd.arrivedAt=Date.now();
  if(s==='picked') upd.pickedAt=Date.now();
  if(s==='done'){ upd.doneAt=Date.now(); upd.photo=!!S.photoURL }
  db.ref('orders/'+o.id).update(upd).then(()=>{
    if(s==='done'){
      // сам снимок кладём отдельно от заявки: список заявок читают все,
      // и таскать вместе с ним десятки фотографий нельзя

        img:S.photoURL, at:Date.now(), by:uid
      }).catch(()=>toast('Фото не сохранилось — проверьте правила Firebase'));
      S.finOrder={...o,...upd}; S.activeJob=null; S.photoURL=null;
      S.view='fin'; render();

function giveUp(){
  const o=S.activeJob; if(!o) return;
  db.ref('orders/'+o.id).transaction(cur=>{
    if(!cur||cur.volunteerId!==uid||cur.status==='done'||cur.status==='cancelled') return cur;
    cur.status='open';
    cur.volunteerId=null; cur.volunteerName=null; cur.volunteerPhone=null;
    cur.takenAt=null; cur.arrivedAt=null; cur.pickedAt=null;
    return cur;
  }).then(()=>{
    S.activeJob=null; S.photoURL=null; S.view='home'; render();
    toast('Заявка вернулась другим волонтёрам');
  }).catch(()=>toast('Не удалось вернуть заявку'));
}
/* Общий обработчик снимка: ужимает и отдаёт data URL в колбэк.
   max — длинная сторона в пикселях, q — качество JPEG. */
function readPhoto(inp,max,q,done){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>=h && w>max){ h=Math.round(h*max/w); w=max }
    else if(h>w && h>max){ w=Math.round(w*max/h); h=max }
    let out=null;
    try{
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      out=c.toDataURL('image/jpeg',q);
    }catch(e){}
    URL.revokeObjectURL(url);
    if(out) done(out); else toast('Не удалось обработать фото');
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('Не удалось открыть фото') };
  img.src=url;
}

function sendRating(){
  const o=S.finOrder;
  if(S.rating && o && db){
    const isCl=ROLE==='cl';
    const field=isCl?'ratingOfVolunteer':'ratingOfResident';
    const target=isCl?o.volunteerId:o.clientId;
    const payload={stars:S.rating, comment:(S.comment||'').trim().slice(0,300), at:Date.now()};
    if(S.reasons.length) payload.reasons=S.reasons.slice();
    db.ref('orders/'+o.id+'/'+field).set(payload).catch(()=>{});
    if(target){
      db.ref('leaderboard/'+target).transaction(cur=>{
        if(cur===null) return;                // запись появится сама после заявки
        cur.ratingSum=(cur.ratingSum||0)+S.rating;
        cur.ratingCount=(cur.ratingCount||0)+1;
        return cur;
      });
    }
    toast('Спасибо, оценка отправлена');
  }
  S.rating=0; S.comment=''; S.reasons=[]; S.finOrder=null; S.view='home'; render();
}
